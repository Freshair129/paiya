[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "paiya"
version = "0.1.0"
description = "Paiya buyer-side deal monitoring platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.15,<2",
  "fastapi>=0.115,<1",
  "jsonschema==4.26.0",
  "mcp==2.3.0",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/paiya"]

[tool.ruff]
target-version = "py312"
line-length = 100
# Legacy documentation checkers predate A0 and are outside Issue #8 scope.
extend-exclude = ["scripts/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
files = ["src"]

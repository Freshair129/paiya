[project]
name = "paiya-collector"
version = "0.1.0"
description = "Offline synthetic HTML collector for Paiya's v1 inbox"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
browser = [
    "playwright>=1.55,<2",
]

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run --frozen python scripts/check_docs.py
      - run: uv run --frozen python scripts/check_contracts.py
      - run: uv run --frozen python scripts/check_scenarios.py

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: paiya
          POSTGRES_PASSWORD: paiya_dev_only
          POSTGRES_DB: paiya_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U paiya -d paiya_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PAIYA_DATABASE_URL: postgresql+psycopg://paiya:paiya_dev_only@127.0.0.1:5432/paiya_test
      PAIYA_TEST_DATABASE_URL: postgresql+psycopg://paiya:paiya_dev_only@127.0.0.1:5432/paiya_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy src
      - run: uv run --frozen alembic upgrade head
      - run: uv run --frozen pytest

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - run: corepack enable && corepack prepare pnpm@10.20.0 --activate
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web lint
      - run: pnpm --dir web typecheck
      - run: pnpm --dir web test
      - run: pnpm --dir web build

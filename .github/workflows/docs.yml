name: Docs integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check documentation links and requirement IDs
        run: python3 scripts/check_docs.py
      - name: Check contract schema, fixtures and examples
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --disable-pip-version-check -q -r requirements-dev.txt
          "$RUNNER_TEMP/venv/bin/python" scripts/check_contracts.py

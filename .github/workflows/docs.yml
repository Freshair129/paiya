name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run --frozen python scripts/check_docs.py
      - run: uv run --frozen python scripts/check_contracts.py
      - run: uv run --frozen python scripts/check_scenarios.py
      - run: uv run --frozen python scripts/check_corpus.py

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: paiya
          POSTGRES_PASSWORD: paiya_dev_only
          POSTGRES_DB: paiya_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U paiya -d paiya_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PAIYA_DATABASE_URL: postgresql+psycopg://paiya:paiya_dev_only@127.0.0.1:5432/paiya_test
      PAIYA_TEST_DATABASE_URL: postgresql+psycopg://paiya:paiya_dev_only@127.0.0.1:5432/paiya_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - name: Configure PostgreSQL 17 backup tools
        run: |
          echo "PAIYA_PG_DUMP=docker exec -i -e PGPASSWORD ${{ job.services.postgres.id }} pg_dump" >> "$GITHUB_ENV"
          echo "PAIYA_PG_RESTORE=docker exec -i -e PGPASSWORD ${{ job.services.postgres.id }} pg_restore" >> "$GITHUB_ENV"
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy src
      - run: uv run --frozen alembic upgrade head
      - run: uv run --frozen pytest
      - run: uv sync --project collector --frozen --group dev
      - run: uv run --project collector --frozen python -m pytest

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - run: corepack enable && corepack prepare pnpm@10.20.0 --activate
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web lint
      - run: pnpm --dir web typecheck
      - run: pnpm --dir web test
      - run: pnpm --dir web build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: paiya
          POSTGRES_PASSWORD: paiya_dev_only
          POSTGRES_DB: paiya_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U paiya -d paiya_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PAIYA_DATABASE_URL: postgresql+psycopg://paiya:paiya_dev_only@127.0.0.1:5432/paiya_test
      PAIYA_READ_CONTEXT_GROUP_KEY: synthetic-demo
      PAIYA_DEV_FIXTURE_MODE: "1"
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - run: uv sync --frozen
      - run: uv run --frozen alembic upgrade head
      - name: Create temporary fixture media root
        run: |
          media_root="$RUNNER_TEMP/paiya-fixture-media"
          mkdir -p "$media_root"
          echo "PAIYA_FIXTURE_MEDIA_ROOT=$media_root" >> "$GITHUB_ENV"
          # The runner context is not available in job-level env, so set it here.
          echo "XDG_DATA_HOME=$RUNNER_TEMP/paiya-e2e-auth-data" >> "$GITHUB_ENV"
      - run: uv run --frozen python -m paiya.cli demo seed
      - name: Add synthetic manual-share grant for the import test
        run: |
          uv run --frozen python - <<'PY'
          import os
          from datetime import UTC, datetime, timedelta
          from uuid import uuid4

          from sqlalchemy import create_engine, insert, select

          from paiya.store.tables import groups, source_grants

          engine = create_engine(os.environ["PAIYA_DATABASE_URL"])
          with engine.begin() as conn:
              group_id = conn.execute(
                  select(groups.c.id).where(groups.c.group_key == "synthetic-demo")
              ).scalar_one()
              conn.execute(
                  insert(source_grants).values(
                      id=uuid4(),
                      group_id=group_id,
                      source_kind="manual_share",
                      scopes=["capture"],
                      authority_ref="synthetic:m1b-e2e",
                      valid_from=datetime.now(UTC) - timedelta(minutes=1),
                      valid_until=None,
                      retention_days=30,
                  )
              )
          engine.dispose()
          PY
      - name: Prepare temporary owner authentication
        run: |
          uv run --frozen python - <<'PY'
          import os
          import secrets
          from pathlib import Path

          from paiya.auth.credentials import (
              _secure_directory,
              _secure_file,
              create_auth_verifier,
          )

          passphrase_path = Path(os.environ["RUNNER_TEMP"]) / "paiya-e2e-passphrase"
          _secure_directory(passphrase_path.parent)
          passphrase = secrets.token_urlsafe(32)
          with passphrase_path.open("x", encoding="utf-8") as output:
              output.write(passphrase)
          _secure_file(passphrase_path)
          create_auth_verifier(passphrase)
          PY
      - run: corepack enable && corepack prepare pnpm@10.20.0 --activate
      - name: Install web dependencies
        working-directory: web
        run: corepack pnpm install --frozen-lockfile
      - name: Build web app
        working-directory: web
        run: corepack pnpm build
      - name: Start fixture server and wait for readiness
        run: |
          set -euo pipefail
          uv run --frozen python -m paiya.serve > "$RUNNER_TEMP/paiya-serve.log" 2>&1 &
          server_pid=$!
          echo "$server_pid" > "$RUNNER_TEMP/paiya-serve.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/v1/groups >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/paiya-serve.log"
              exit 1
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/paiya-serve.log"
          exit 1
      - name: Install Playwright Chromium
        working-directory: web
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Run browser tests
        working-directory: web
        env:
          PAIYA_E2E_PASSPHRASE_FILE: ${{ runner.temp }}/paiya-e2e-passphrase
        run: corepack pnpm e2e
      - name: Remove temporary owner authentication
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/paiya-e2e-passphrase"
          rm -rf "$RUNNER_TEMP/paiya-e2e-auth-data"
      - name: Upload Playwright report and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: paiya-e2e-report-and-screenshots
          path: |
            web/test-results/e2e/
            web/playwright-report/
          if-no-files-found: ignore

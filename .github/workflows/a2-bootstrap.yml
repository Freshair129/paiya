name: A2 temporary dependency and formatter bootstrap

on:
  push:
    branches: [feat/13-fixture-ingest]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - run: uv lock
      - run: uv sync --frozen
      - run: uv run --frozen ruff check --fix src/paiya/ingest/ src/paiya/store/ src/paiya/api/ tests/test_a2_ingest.py migrations/versions/0002_fixture_ingest.py
      - run: uv run --frozen ruff format src/paiya/ingest/ src/paiya/store/ src/paiya/api/ tests/test_a2_ingest.py migrations/versions/0002_fixture_ingest.py
      - name: Commit generated lock and formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock src/paiya/ingest/ src/paiya/store/ src/paiya/api/ tests/test_a2_ingest.py migrations/versions/0002_fixture_ingest.py
          if ! git diff --cached --quiet; then
            git commit -m "chore(A2): update uv lock and normalize Python formatting"
            git push
          fi
